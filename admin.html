
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIHIT FITNESS CLUB - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101820;color:white;font-family:Arial}
.container{max-width:1000px;margin:30px auto;background:#1c2935;padding:22px;border-radius:14px}
h1{color:#f5b700;text-align:center}
input,button{width:100%;padding:13px;margin:8px 0;border:0;border-radius:7px;font-size:16px}
input{background:#101820;color:white;border:1px solid #475569}
button{background:#f5b700;color:#101820;font-weight:bold;cursor:pointer}
.logout{background:#dc3545;color:white}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:10px;border:1px solid #475569;text-align:left}
th{background:#334155}
.table-wrap{overflow-x:auto}
#dashboard{display:none}
#message{color:#f5b700;text-align:center;white-space:pre-wrap}
.section{margin-top:28px}
.paid{color:#22c55e;font-weight:bold}
.pending{color:#f87171;font-weight:bold}
.no-record{color:#fbbf24;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>NIHIT FITNESS CLUB</h1>
<h2 style="text-align:center">Admin Dashboard</h2>

<div id="login">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email" required>
<input id="password" type="password" placeholder="Password" required>
<button id="loginBtn" onclick="login()">LOGIN</button>
</div>

<div id="dashboard">
<button onclick="loadMembers()">REFRESH MEMBERS</button>
<button onclick="loadAttendance()">REFRESH ATTENDANCE</button>
<button class="logout" onclick="logout()">LOGOUT</button>

<div class="section">
<h3>Member List</h3>
<input id="search" placeholder="Search Name, Member ID or Mobile" oninput="showMembers()">
<p id="count"></p>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Member ID</th>
<th>Name</th>
 <th>Registration Date</th>
<th>Mobile</th>
<th>Plan</th>
<th>Status</th>
<th>Payment</th>
 <th>Action</th>            
</tr>
</thead>
<tbody id="memberRows"></tbody>
</table>
</div>
</div>

<div class="section">
<h3>Attendance Report</h3>
<p id="attendanceCount">Total Check-ins: 0</p>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th>
<th>Member ID</th>
<th>Name</th>
<th>Mobile</th>
<th>Check-in Time</th>
</tr>
</thead>
<tbody id="attendanceRows"></tbody>
</table>
</div>
</div>
</div>

<p id="message"></p>
</div>

<script>
const SUPABASE_URL = "https://fuxdsulcdscdfoswehka.supabase.co";
const SUPABASE_KEY = "sb_publishable_tPJTQGaKKcj1oeV3p54k5Q_pRjMsmUr";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let members = [];

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const btn=document.getElementById("loginBtn");
 const msg=document.getElementById("message");

 if(!email || !password){
   msg.textContent="Enter email and password.";
   return;
 }

 btn.disabled=true;
 msg.textContent="Logging in...";

 const {error}=await db.auth.signInWithPassword({email,password});

 btn.disabled=false;

 if(error){
   msg.textContent="Login failed: "+error.message;
   return;
 }

 document.getElementById("login").style.display="none";
 document.getElementById("dashboard").style.display="block";
 msg.textContent="";

 await loadMembers();
 await loadAttendance();
}

async function loadMembers(){
 const msg=document.getElementById("message");
 msg.textContent="Loading members and payment status...";

 const {data,error}=await db
 .from("members")
 .select("id,member_id,full_name,mobile,plan,status,created_at,is_active")
.eq("is_active", true)
 .order("created_at",{ascending:false});

 if(error){
   msg.textContent="Could not load members: "+error.message;
   return;
 }

 const {data:paymentData,error:paymentError}=await db
 .from("payments")
 .select("member_id,status,amount,payment_date,created_at")
 .order("created_at",{ascending:false});

 if(paymentError){
   msg.textContent="Members loaded, but payment status could not be loaded: "+paymentError.message;
   members=data || [];
   showMembers();
   return;
 }

 const latestPayments={};

 (paymentData || []).forEach(p=>{
   if(!latestPayments[p.member_id]){
     latestPayments[p.member_id]=p;
   }
 });

 members=(data || []).map(m=>({
   ...m,
   payment:latestPayments[m.id] || null
 }));

 msg.textContent="";
 showMembers();
}


function showMembers(){
 const term=document.getElementById("search").value.toLowerCase();

 members.sort((a,b)=>{
   const order = {pending:0, paid:1};
   const statusA = (a.payment?.status || "no-record").toLowerCase();
   const statusB = (b.payment?.status || "no-record").toLowerCase();
   return (order[statusA] ?? 2) - (order[statusB] ?? 2);
 });

 const filtered=members.filter(m=>
  (m.member_id||"").toLowerCase().includes(term) ||
  (m.full_name||"").toLowerCase().includes(term) ||
  (m.mobile||"").includes(term)
 );

 document.getElementById("count").textContent=
 "Total Members: "+filtered.length;

 document.getElementById("memberRows").innerHTML=
 filtered.map(m=>{
   const payment=m.payment;
   let paymentHTML='<span class="no-record">No Record</span>';

   if(payment){
     const status=(payment.status||"").toLowerCase();

     if(status==="paid"){
       paymentHTML='<span class="paid">Paid</span>';
     }else if(status==="pending"){
       paymentHTML='<span class="pending">Pending</span>';
     }else{
       paymentHTML='<span class="no-record">'+escapeHTML(payment.status||"Unknown")+'</span>';
     }
   }

   return `<tr>
     <td>${escapeHTML(m.member_id)}</td>
     <td>${escapeHTML(m.full_name)}</td>
     <td>${escapeHTML(m.created_at ? new Date(m.created_at).toLocaleDateString("en-IN",{timeZone:"Asia/Kolkata"}) : "-")}</td>
     <td>${escapeHTML(m.mobile)}</td>
     <td>${escapeHTML(m.plan||"-")}</td>
     <td>${escapeHTML(m.status||"-")}</td>
     <td>${paymentHTML}</td>
     <td><button onclick="deactivateMember('${m.id}')">DEACTIVATE</button></td>
   </tr>`;
 }).join("");
}

 

 
 



async function loadAttendance(){
 const msg=document.getElementById("message");
 msg.textContent="Loading attendance...";

 const {data,error}=await db
 .from("attendance")
 .select(`
   attendance_date,
   checkin_at,
   members (
     member_id,
     full_name,
     mobile
   )
 `)
 .order("attendance_date",{ascending:false})
 .order("checkin_at",{ascending:false})
 .limit(500);

 if(error){
   msg.textContent="Could not load attendance: "+error.message;
   return;
 }

 const records=data || [];

 document.getElementById("attendanceCount").textContent=
 "Total Check-ins: "+records.length;

 document.getElementById("attendanceRows").innerHTML=
 records.map(a=>{
   const m=a.members || {};
   return `<tr>
     <td>${escapeHTML(a.attendance_date||"-")}</td>
     <td>${escapeHTML(m.member_id||"-")}</td>
     <td>${escapeHTML(m.full_name||"-")}</td>
     <td>${escapeHTML(m.mobile||"-")}</td>
     <td>${escapeHTML(a.checkin_at ? new Date(a.checkin_at).toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"}) : "-")}</td>
   </tr>`;
 }).join("");

 msg.textContent="";
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}
async function deactivateMember(id){
 if(!confirm("Are you sure you want to deactivate this member?")){
   return;
 }

 const {error}=await db
   .from("members")
   .update({is_active:false})
   .eq("id",id);

 if(error){
   alert("Could not deactivate member: "+error.message);
   return;
 }

 alert("Member deactivated successfully.");
 await loadMembers();
}
async function logout(){
 await db.auth.signOut();
 members=[];
 document.getElementById("dashboard").style.display="none";
 document.getElementById("login").style.display="block";
 document.getElementById("password").value="";
 document.getElementById("message").textContent="Logged out.";
}
</script>
</body>
</html>
