<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIHIT FITNESS CLUB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101820;color:white;padding:20px}
.container{max-width:480px;margin:35px auto;background:#1c2935;padding:25px;border-radius:16px}
h1{text-align:center;color:#f5b700;margin-bottom:5px}
p{text-align:center;color:#cbd5e1}
input,select,button{width:100%;padding:14px;margin:9px 0;border-radius:8px;border:1px solid #475569;font-size:16px}
input,select{background:#101820;color:white}
button{background:#f5b700;color:#101820;font-weight:bold;border:0;cursor:pointer}
button:disabled{opacity:.6}
#message{text-align:center;margin-top:15px;line-height:1.5}
.small{text-align:center;font-size:12px;color:#94a3b8}
label{display:block;margin-top:12px;color:#f5b700}
</style>
</head>
<body>

<div style="max-width:480px;margin:0 auto 20px;background:#1c2935;padding:20px;border-radius:16px;text-align:center;">
<h2 style="color:#f5b700;">NIHIT FITNESS CLUB</h2>
<p>Management Menu</p>
<a href="admin.html" style="display:block;background:#f5b700;color:#101820;padding:14px;margin:10px 0;border-radius:8px;text-decoration:none;font-weight:bold;">ADMIN DASHBOARD</a>
<a href="fees.html" style="display:block;background:#f5b700;color:#101820;padding:14px;margin:10px 0;border-radius:8px;text-decoration:none;font-weight:bold;">FEES MANAGEMENT</a>
<a href="checkin.html" style="display:block;background:#f5b700;color:#101820;padding:14px;margin:10px 0;border-radius:8px;text-decoration:none;font-weight:bold;">MEMBER QR CHECK-IN</a>
<a href="#registerForm" style="display:block;background:#334155;color:white;padding:14px;margin:10px 0;border-radius:8px;text-decoration:none;font-weight:bold;">NEW MEMBER REGISTRATION</a>
</div>

<div class="container">
<h1>NIHIT FITNESS CLUB</h1>
<p>New Member Registration</p>

<form id="registerForm">
<label>Full Name</label>
<input id="name" placeholder="Full Name" required minlength="2">

<label>Mobile Number</label>
<input id="mobile" placeholder="10 Digit Mobile Number" inputmode="numeric" maxlength="10" required>

<label>Age</label>
<input id="age" type="number" placeholder="Age" min="10" max="100">

<label>Gender</label>
<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Membership Plan</label>
<select id="plan" required>
<option value="">Select Membership Plan</option>
<option>Monthly (Standard)</option>
<option>Quarterly</option>
<option>Half Yearly</option>
<option>Yearly</option>
</select>

<label>Personal PIN</label>
<input id="pin" type="password" placeholder="Create Personal PIN (4-8 digits)" inputmode="numeric" maxlength="8" required>

<label>Payment Mode</label>
<select id="paymentMode" required>
<option value="">Select Payment Mode</option>
<option>Cash</option>
<option>UPI</option>
<option>Card</option>
<option>Bank Transfer</option>
</select>

<label>Payment Status</label>
<select id="paymentStatus" required>
<option value="">Select Payment Status</option>
<option>Paid</option>
<option>Pending</option>
</select>

<label>Payment Amount (₹)</label>
<input id="paymentAmount" type="number" placeholder="Enter Payment Amount" min="0.01" step="0.01" required>

<button id="submitBtn" type="submit">REGISTER NOW</button>
</form>

<div id="message"></div>
<p class="small">Welcome to NIHIT FITNESS CLUB</p>
</div>

<script>
const SUPABASE_URL = "https://fuxdsulcdscdfoswehka.supabase.co";
const SUPABASE_KEY = "sb_publishable_tPJTQGaKKcj1oeV3p54k5Q_pRjMsmUr";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("registerForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const btn = document.getElementById("submitBtn");
  const message = document.getElementById("message");

  const fullName = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const ageValue = document.getElementById("age").value;
  const age = ageValue ? Number(ageValue) : null;
  const gender = document.getElementById("gender").value || null;
  const plan = document.getElementById("plan").value;
  const pin = document.getElementById("pin").value;
  const paymentMode = document.getElementById("paymentMode").value;
  const paymentStatus = document.getElementById("paymentStatus").value;
  const paymentAmount = Number(document.getElementById("paymentAmount").value);

  if(!/^[0-9]{10}$/.test(mobile)){
    message.textContent = "Please enter a valid 10 digit mobile number.";
    return;
  }

  if(!/^[0-9]{4,8}$/.test(pin)){
    message.textContent = "PIN must contain 4 to 8 digits.";
    return;
  }

  if(!Number.isFinite(paymentAmount) || paymentAmount <= 0){
    message.textContent = "Please enter a valid payment amount.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "PLEASE WAIT...";
  message.textContent = "";

  try {
    const {data, error} = await db.rpc("register_member", {
      p_full_name: fullName,
      p_mobile: mobile,
      p_pin: pin,
      p_plan: plan,
      p_age: age,
      p_gender: gender,
      p_payment_mode: paymentMode,
      p_payment_status: paymentStatus,
      p_payment_amount: paymentAmount
    });

    if(error) throw error;

    message.innerHTML = "Registration Successful!<br>Your Member ID: <strong>" + data + "</strong><br>Payment Status: " + paymentStatus;

    document.getElementById("registerForm").reset();

  } catch(error) {
    message.textContent = "Registration failed: " + error.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "REGISTER NOW";
  }
});
</script>
</body>
</html>
