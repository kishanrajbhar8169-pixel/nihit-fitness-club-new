
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIHIT FITNESS CLUB - Fees</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101820;color:white;font-family:Arial}
.container{max-width:750px;margin:25px auto;background:#1c2935;padding:22px;border-radius:14px}
h1{color:#f5b700;text-align:center}
input,select,button{width:100%;padding:14px;margin:9px 0;border-radius:8px;font-size:16px}
input,select{background:#101820;color:white;border:1px solid #475569}
button{background:#f5b700;color:#101820;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.mark-btn{background:#35d07f;color:#102018;margin-top:8px}
#message{text-align:center;white-space:pre-wrap}
a{color:#f5b700}
.section{margin-top:25px;padding:15px;background:#263747;border-radius:10px}
.summary{background:#493b19;padding:18px;border-radius:10px;text-align:center;margin-top:15px}
.summary h2{color:#f5b700;margin:8px}
.record{padding:12px;margin:9px 0;background:#334155;border-radius:8px}
.pending{border-left:4px solid #f5b700}
.paid{border-left:4px solid #35d07f}
</style>
</head>
<body>
<div class="container">
<h1>NIHIT FITNESS CLUB</h1>
<h2>Fees Renewal</h2>
<p id="message">Checking Admin Login...</p>

<div id="panel" style="display:none">
<div class="section">
<h3>Save Payment</h3>
<label>Select Member</label>
<select id="member" required>
<option value="">Loading Members...</option>
</select>
<label>Amount (₹)</label>
<input id="amount" type="number" min="1" step="0.01" placeholder="Enter Fees Amount" required>
<label>Payment Date</label>
<input id="date" type="date" required>
<label>Payment Mode</label>
<select id="mode">
<option value="Cash">Cash</option>
<option value="UPI">UPI</option>
<option value="Card">Card</option>
<option value="Bank Transfer">Bank Transfer</option>
</select>
<label>Payment Type</label>
<select id="paymentType">
<option value="regular">Regular Fee</option>
<option value="renewal">Membership Renewal</option>
</select>
 <label>Payment Status</label>
<select id="status">
<option value="Paid">Paid</option>
<option value="Pending">Pending</option>
</select>
<button id="saveBtn" onclick="savePayment()">SAVE PAYMENT</button>
</div>

<div class="summary">
<h3>Total Pending Fees</h3>
<h2 id="pendingTotal">₹0.00</h2>
<p id="pendingCount">Pending Records: 0</p>
</div>

<div class="section">
<h3>Pending Fees Report</h3>
<div id="pendingRecords">Loading...</div>
</div>

<div class="section">
<h3>All Payment Records</h3>
<div id="records">Loading...</div>
</div>
<p><a href="admin.html">Back to Admin Dashboard</a></p>
</div>
</div>

<script>
const db=window.supabase.createClient(
 "https://fuxdsulcdscdfoswehka.supabase.co",
 "sb_publishable_tPJTQGaKKcj1oeV3p54k5Q_pRjMsmUr"
);

function today(){
 return new Date().toLocaleDateString("en-CA");
}
document.getElementById("date").value=today();

async function init(){
 const msg=document.getElementById("message");
 const {data:{session},error}=await db.auth.getSession();

 if(error || !session){
  msg.textContent="Please login from Admin Dashboard first.";
  return;
 }

 const {data:admin,error:adminError}=await db
 .from("admin_users").select("user_id")
 .eq("user_id",session.user.id).maybeSingle();

 if(adminError || !admin){
  msg.textContent="Access denied. Admin account required.";
  return;
 }

 document.getElementById("panel").style.display="block";
 msg.textContent="";
 await loadMembers();
 await loadPayments();
}

async function loadMembers(){
 const {data,error}=await db.from("members")
 .select("id,member_id,full_name,mobile")
 .order("full_name");

 if(error){
  document.getElementById("message").textContent=error.message;
  return;
 }

 const select=document.getElementById("member");
 select.innerHTML='<option value="">Select Member</option>';

 (data||[]).forEach(m=>{
  const option=document.createElement("option");
  option.value=m.id;
  option.textContent=m.member_id+" - "+m.full_name+" ("+m.mobile+")";
  select.appendChild(option);
 });
}

async function savePayment(){
 const member=document.getElementById("member").value;
 const amount=Number(document.getElementById("amount").value);
 const date=document.getElementById("date").value;
 const mode=document.getElementById("mode").value;
 const status=document.getElementById("status").value;
 const paymentType=document.getElementById("paymentType").value;
 const msg=document.getElementById("message");
 const btn=document.getElementById("saveBtn");

 if(!member || !amount || amount<=0 || !date){
  msg.textContent="Please fill all required fields.";
  return;
 }

 btn.disabled=true;
 msg.textContent="Saving payment...";

const {error}=await db.from("payments").insert([{
  member_id:member,
  amount:amount,
  payment_date:date,
  payment_mode:mode,
  status:status,
  is_renewal:paymentType==="renewal"
 }]);

 btn.disabled=false;

 if(error){
  msg.textContent="Payment failed: "+error.message;
  return;
 }

 msg.textContent="Payment record saved successfully.";
 document.getElementById("amount").value="";
 await loadPayments();
}

async function markAsPaid(id,button){
 if(!confirm("Are you sure this payment has been received?")) return;

 button.disabled=true;
 button.textContent="Updating...";

 const {data,error}=await db
 .from("payments")
 .update({status:"Paid"})
 .eq("id",id)
 .eq("status","Pending")
 .select("id");

 if(error){
  document.getElementById("message").textContent=
   "Update failed: "+error.message;
  button.disabled=false;
  button.textContent="MARK AS PAID";
  return;
 }

 if(!data || data.length===0){
  document.getElementById("message").textContent=
   "Payment was not updated. Refresh and check the record.";
  button.disabled=false;
  button.textContent="MARK AS PAID";
  return;
 }

 document.getElementById("message").textContent=
  "Payment marked as Paid successfully.";

 await loadPayments();
}

async function loadPayments(){
 const records=document.getElementById("records");
 const pendingRecords=document.getElementById("pendingRecords");

 const {data,error}=await db.from("payments")
 .select("id,amount,payment_date,payment_mode,status,is_renewal,renewal_applied_at,members(member_id,full_name,mobile)")
 .order("created_at",{ascending:false})
 .limit(1000);

 if(error){
  records.textContent="Could not load records: "+error.message;
  pendingRecords.textContent="Could not load pending records.";
  document.getElementById("message").textContent=error.message;
  return;
 }

 const payments=data||[];
 const pending=payments.filter(p=>p.status==="Pending");
 const total=pending.reduce((sum,p)=>sum+Number(p.amount||0),0);

 document.getElementById("pendingTotal").textContent=
 "₹"+total.toFixed(2);
 document.getElementById("pendingCount").textContent=
 "Pending Records: "+pending.length;

 pendingRecords.innerHTML="";

 if(!pending.length){
  pendingRecords.textContent="No pending payment records.";
 }else{
  pending.forEach(p=>{
   const div=document.createElement("div");
   div.className="record pending";

   const title=document.createElement("strong");
   title.textContent=(p.members?.member_id||"Member")+" - "+(p.members?.full_name||"");

   const detail=document.createElement("p");
   const paymentType = p.is_renewal ? "Membership Renewal" : "Regular Fee";

detail.textContent =
 "Pending: ₹"+p.amount+" | "+p.payment_date+" | "+p.payment_mode+" | "+paymentType;

   const btn=document.createElement("button");
   btn.className="mark-btn";
   btn.textContent="MARK AS PAID";
   btn.onclick=()=>markAsPaid(p.id,btn);

   div.append(title,detail,btn);
   pendingRecords.appendChild(div);
  });
 }

 records.innerHTML="";

 if(!payments.length){
  records.textContent="No payment records yet.";
 }else{
  payments.forEach(p=>{
   const div=document.createElement("div");
   div.className="record "+(p.status==="Paid"?"paid":"pending");

   const title=document.createElement("strong");
   title.textContent=(p.members?.member_id||"Member")+" - "+(p.members?.full_name||"");

   const detail=document.createElement("p");
   const paymentType = p.is_renewal ? "Membership Renewal" : "Regular Fee";

detail.textContent =
 "₹"+p.amount+" | "+p.payment_date+" | "+p.payment_mode+" | "+p.status+" | "+paymentType;

   div.append(title,detail);
   records.appendChild(div);
  });
 }
}

init();
</script>
</body>
</html>
