  <script>
    const SUPABASE_URL = "https://fuxdsulcdscdfoswehka.supabase.co";
    const SUPABASE_KEY = "sb_publishable_tPJTQGaKKcj1oeV3p54k5Q_pRjMsmUr";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("memberForm");
    const result = document.getElementById("result");
    const checkinBtn = document.getElementById("checkinBtn");
    const membershipBtn = document.getElementById("membershipBtn");
    const details = document.getElementById("membershipDetails");

    function getCredentials() {
      return {
        identifier: document.getElementById("identifier").value.trim(),
        pin: document.getElementById("pin").value.trim()
      };
    }

    function validCredentials(identifier, pin) {
      if (!identifier || !/^[0-9]{4,8}$/.test(pin)) {
        result.textContent = "Please enter your Member ID/Mobile Number and valid 4–8 digit PIN.";
        result.style.color = "#ff7777";
        return false;
      }
      return true;
    }

    function showMessage(message, color) {
      result.textContent = message;
      result.style.color = color;
    }

    // Attendance: existing function is unchanged
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const { identifier, pin } = getCredentials();
      details.style.display = "none";

      if (!validCredentials(identifier, pin)) return;

      checkinBtn.disabled = true;
      membershipBtn.disabled = true;
      showMessage("Checking attendance...", "#f5b400");

      try {
        const { data, error } = await db.rpc("member_checkin", {
          p_identifier: identifier,
          p_pin: pin
        });

        if (error) throw error;

        showMessage(
          data,
          data === "Attendance marked successfully" ? "#35d07f" : "#ff7777"
        );

        if (data === "Attendance marked successfully") {
          document.getElementById("pin").value = "";
        }
      } catch (error) {
        console.error(error);
        showMessage("Check-in failed. Please try again.", "#ff7777");
      } finally {
        checkinBtn.disabled = false;
        membershipBtn.disabled = false;
      }
    });

    // Membership status
    membershipBtn.addEventListener("click", async () => {
      const { identifier, pin } = getCredentials();
      details.style.display = "none";

      if (!validCredentials(identifier, pin)) return;

      checkinBtn.disabled = true;
      membershipBtn.disabled = true;
      showMessage("Checking membership...", "#f5b400");

      try {
        const { data, error } = await db.rpc("member_membership_status", {
          p_identifier: identifier,
          p_pin: pin
        });

        if (error) throw error;

        if (!data || data.success !== true) {
          showMessage(
            data?.message || "Membership details not found.",
            "#ff7777"
          );
          return;
        }

        document.getElementById("memberName").textContent = data.full_name || "-";
        document.getElementById("memberId").textContent = data.member_id || "-";
        document.getElementById("memberPlan").textContent = data.plan || "-";

        if (data.expiry_date) {
          const parts = String(data.expiry_date).slice(0, 10).split("-");
          const date = new Date(
            Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])
          );
          document.getElementById("expiryDate").textContent =
            date.toLocaleDateString("en-IN");
        } else {
          document.getElementById("expiryDate").textContent = "Not available";
        }

        const days = data.days_remaining;
        const statusBox = document.getElementById("membershipStatus");
        const daysBox = document.getElementById("membershipDays");

        if (days === null || days === undefined) {
          statusBox.textContent = "EXPIRY DATE UNAVAILABLE";
          statusBox.style.color = "#ffb84d";
          daysBox.textContent = "Not available";
        } else if (Number(days) < 0) {
          statusBox.textContent = "MEMBERSHIP EXPIRED";
          statusBox.style.color = "#ff7777";
          daysBox.textContent = Math.abs(Number(days)) + " days expired";
        } else if (Number(days) === 0) {
          statusBox.textContent = "LAST DAY OF MEMBERSHIP";
          statusBox.style.color = "#ffb84d";
          daysBox.textContent = "0 days remaining";
        } else {
          statusBox.textContent = "MEMBERSHIP ACTIVE";
          statusBox.style.color = "#35d07f";
          daysBox.textContent = Number(days) + " days remaining";
        }

        details.style.display = "block";
        showMessage("Membership details found.", "#35d07f");

      } catch (error) {
        console.error(error);
        showMessage("Unable to check membership. Please try again.", "#ff7777");
      } finally {
        checkinBtn.disabled = false;
        membershipBtn.disabled = false;
      }
    });
  </script>
